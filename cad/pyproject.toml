[project]
name = "download-model"
version = "0.0.0"
description = "A script for automatically downloading models from onshape"
readme = "README.md"
authors = [
  { name = "tomicodev", email = "humansbadrobotsgood@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
download-model = "download_model:main"

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "download_model"
module-root = ""